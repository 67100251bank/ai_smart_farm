<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="แอปควบคุมโรงเพาะเห็ดอัจฉริยะด้วย AI (โหมดจำลอง) — ทีม โจรสลัดพิกเซล UP AI Hackathon 2026">
<title>Smart Mushroom Farm</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>/* AI Smart Mushroom Farm — ระบบสีและเลย์เอาต์
   จานสี: ดินเพาะ/สายใยเห็ด (นิวทรัลอมเขียว) + ละอองน้ำ (เขียวน้ำทะเล) + ดอกเห็ด (ส้มดินเผา) */
:root {
  /* นิวทรัลเอียงเขียวเล็กน้อย ให้เข้ากับบรรยากาศโรงเรือน */
  --ground: #EDF1EE;
  --surface: #FBFCFB;
  --surface-2: #E3E9E5;
  --surface-3: #D7DFDA;
  --line: #CBD5CF;
  --line-soft: #DDE4DF;
  --ink: #141B17;
  --ink-2: #55635C;
  --ink-3: #7B8A82;

  --accent: #005F6B;
  --accent-ink: #FFFFFF;
  --accent-soft: #DBEBED;

  --temp: #C75126;
  --humid: #0089A0;
  --temp-fill: rgba(199, 81, 38, .14);
  --humid-fill: rgba(0, 137, 160, .14);

  --good: #2E7A56;
  --good-bg: #DFEEE6;
  --warn: #8A5B00;
  --warn-bg: #F6E9CE;
  --crit: #A32A20;
  --crit-bg: #F7E1DE;

  --band: rgba(0, 95, 107, .07);
  --grid: rgba(20, 27, 23, .09);

  --r-lg: 18px;
  --r-md: 13px;
  --r-sm: 9px;
  --shadow: 0 1px 2px rgba(20, 27, 23, .06), 0 8px 24px -14px rgba(20, 27, 23, .22);

  --font-display: "Bai Jamjuree", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E1311;
    --surface: #161D19;
    --surface-2: #1E2721;
    --surface-3: #26312A;
    --line: #2B3630;
    --line-soft: #222C26;
    --ink: #E6EDE8;
    --ink-2: #9CAAA3;
    --ink-3: #77857D;

    --accent: #5CC2D4;
    --accent-ink: #06231F;
    --accent-soft: #14312F;

    --temp: #DB7449;
    --humid: #1FA3B8;
    --temp-fill: rgba(219, 116, 73, .17);
    --humid-fill: rgba(31, 163, 184, .17);

    --good: #5FB98D;
    --good-bg: #163024;
    --warn: #D9A63C;
    --warn-bg: #33280D;
    --crit: #F0796B;
    --crit-bg: #3A1A17;

    --band: rgba(92, 194, 212, .09);
    --grid: rgba(230, 237, 232, .10);
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 26px -16px rgba(0, 0, 0, .8);
  }
}
:root[data-theme="dark"] {
  --ground: #0E1311; --surface: #161D19; --surface-2: #1E2721; --surface-3: #26312A;
  --line: #2B3630; --line-soft: #222C26; --ink: #E6EDE8; --ink-2: #9CAAA3; --ink-3: #77857D;
  --accent: #5CC2D4; --accent-ink: #06231F; --accent-soft: #14312F;
  --temp: #DB7449; --humid: #1FA3B8;
  --temp-fill: rgba(219, 116, 73, .17); --humid-fill: rgba(31, 163, 184, .17);
  --good: #5FB98D; --good-bg: #163024; --warn: #D9A63C; --warn-bg: #33280D;
  --crit: #F0796B; --crit-bg: #3A1A17;
  --band: rgba(92, 194, 212, .09); --grid: rgba(230, 237, 232, .10);
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.8);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.app { min-height: 100dvh; display: flex; flex-direction: column; }

/* ───────── หัวแอป ───────── */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
  padding: 10px 14px 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.top-row { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b {
  font-family: var(--font-display); font-weight: 700; font-size: 16px;
  letter-spacing: .1px; white-space: nowrap;
}
.brand span { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
@media (max-width: 439px) { .brand span { display: none; } .brand b { font-size: 15px; } }
.spacer { flex: 1; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
}
.pill svg { width: 12px; height: 12px; flex: none; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.quiet { background: var(--surface-2); color: var(--ink-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.dot.live { animation: beat 2.4s ease-in-out infinite; }
@keyframes beat { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

.clock {
  font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  color: var(--ink-2); display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.clock svg { width: 13px; height: 13px; flex: none; }
.iconbtn {
  appearance: none; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink-2); width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.iconbtn svg { width: 16px; height: 16px; }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.iconbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.seg { display: flex; background: var(--surface-2); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--ink-2);
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  padding: 4px 8px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* ───────── เนื้อหา ───────── */
main { flex: 1; padding: 14px 14px 92px; display: grid; gap: 12px; align-content: start; }
@media (min-width: 760px) {
  main { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 18px 22px 100px; gap: 16px; }
  .wide { grid-column: 1 / -1; }
}
@media (min-width: 1180px) {
  main { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 1500px; margin: 0 auto; width: 100%; }
}

.card {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow);
  min-width: 0;
}
.card > h2 {
  margin: 0 0 2px; font-family: var(--font-display); font-weight: 600;
  font-size: 14px; letter-spacing: .1px; text-wrap: balance;
}
.card > h2 + .sub { margin: 0 0 10px; }
.sub { font-size: 11.5px; color: var(--ink-3); margin: 0 0 8px; }
.head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 600; font-size: 14px; }

/* ป้ายบอกเหตุ */
.banner {
  border-radius: var(--r-md); padding: 11px 13px; display: flex; gap: 10px;
  align-items: flex-start; font-size: 13px; line-height: 1.45;
}
.banner svg { width: 17px; height: 17px; flex: none; margin-top: 1px; }
.banner.crit { background: var(--crit-bg); color: var(--crit); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner b { display: block; font-size: 13px; }
.banner .btn { margin-top: 8px; }

/* ค่าหลัก */
.hero { display: grid; gap: 10px; }
.hero-top { display: flex; align-items: flex-start; gap: 10px; }
.hero-label { font-size: 12px; color: var(--ink-2); font-weight: 600; letter-spacing: .2px; }
.readout { display: flex; align-items: baseline; gap: 4px; margin-top: 2px; }
.readout .v {
  font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -.5px;
}
.readout .u { font-size: 15px; color: var(--ink-2); font-weight: 600; }
.hero.temp .readout .v { color: var(--temp); }
.hero.humid .readout .v { color: var(--humid); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-3); }
.meta b { color: var(--ink-2); font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.spark { width: 100%; height: 46px; display: block; }

/* ตัวเลขสรุป */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line-soft); border-radius: var(--r-md); overflow: hidden; }
@media (min-width: 480px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: var(--surface); padding: 10px 11px; }
.kpi .k { font-size: 10.5px; color: var(--ink-3); letter-spacing: .2px; }
.kpi .n { font-family: var(--font-mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* กราฟ */
.chart-wrap { position: relative; }
canvas.chart { width: 100%; height: 190px; display: block; touch-action: pan-y; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); height: 3px; }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 9px; font-size: 11.5px; box-shadow: var(--shadow); z-index: 5; min-width: 118px;
}
.tip.on { opacity: 1; }
.tip .tt { color: var(--ink-3); font-family: var(--font-mono); font-size: 10.5px; }
.tip .tr { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.tip .tr b { font-family: var(--font-mono); font-weight: 600; }

table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
table.data th, table.data td { text-align: right; padding: 5px 7px; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
table.data th:first-child, table.data td:first-child { text-align: left; font-family: var(--font-mono); color: var(--ink-3); }
table.data th { color: var(--ink-3); font-weight: 600; font-size: 11px; }
.scroll-x { overflow-x: auto; }
.tblbox { max-height: 240px; overflow: auto; border: 1px solid var(--line-soft); border-radius: var(--r-md); }

/* อุปกรณ์ */
.dev { border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 11px; display: grid; gap: 9px; background: var(--surface); }
.dev + .dev { margin-top: 9px; }
.dev-top { display: flex; align-items: center; gap: 9px; }
.dev-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.dev-ico svg { width: 18px; height: 18px; }
.dev-ico.on { background: var(--accent-soft); color: var(--accent); }
.dev-ico.on svg { animation: spin 2.6s linear infinite; }
.dev-ico.on.nospin svg { animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.dev-name { font-weight: 600; font-size: 13.5px; }
.dev-note { font-size: 11px; color: var(--ink-3); font-family: var(--font-mono); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  appearance: none; cursor: pointer; font-family: var(--font-body); font-weight: 600; font-size: 12.5px;
  padding: 7px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ghost { border-style: dashed; color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 11.5px; }

/* แถบความเชื่อมั่น */
.conf { display: grid; gap: 4px; }
.conf-bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.conf-bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.conf-bar i.low { background: var(--warn); }
.conf-note { font-size: 11px; color: var(--ink-3); }
.gate { font-family: var(--font-mono); font-size: 10.5px; }

.list { display: grid; gap: 8px; }
.item { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; line-height: 1.42; }
.item .when { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); flex: none; width: 42px; padding-top: 2px; }
.item .txt { min-width: 0; }
.chipline { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { font-size: 12px; color: var(--ink-3); font-style: italic; padding: 6px 0; }

/* ฟอร์ม */
.field { display: grid; gap: 4px; }
.field label { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.field input[type="number"], .field select {
  font-family: var(--font-mono); font-size: 13px; padding: 7px 9px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.err { color: var(--crit); font-size: 11.5px; }
.ok { color: var(--good); font-size: 11.5px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.switch:last-child { border-bottom: 0; }
.switch .st { font-size: 12.5px; font-weight: 600; }
.switch .sd { font-size: 11px; color: var(--ink-3); }
.toggle {
  appearance: none; width: 42px; height: 24px; border-radius: 99px; background: var(--surface-3);
  border: 0; position: relative; cursor: pointer; flex: none; transition: background .18s;
}
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(18px); }

/* ภาพเห็ด */
.viewer { position: relative; border-radius: var(--r-md); overflow: hidden; background: #0d100e; }
canvas.cvcanvas { width: 100%; display: block; aspect-ratio: 4 / 3; }
.viewer .stamp {
  position: absolute; left: 8px; bottom: 8px; font-family: var(--font-mono); font-size: 10px;
  color: #dfe7e2; background: rgba(0,0,0,.5); padding: 3px 7px; border-radius: 6px; letter-spacing: .2px;
}
.mgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line-soft); border-radius: var(--r-md); overflow: hidden; margin-top: 10px; }
@media (min-width: 520px) { .mgrid { grid-template-columns: repeat(3, 1fr); } }
.mgrid > div { background: var(--surface); padding: 9px 10px; }
.mgrid .k { font-size: 10.5px; color: var(--ink-3); }
.mgrid .n { font-family: var(--font-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* แถบเมนูล่าง */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  appearance: none; border: 0; background: transparent; color: var(--ink-3);
  display: grid; justify-items: center; gap: 3px; padding: 5px 2px; border-radius: 11px;
  font-size: 10.5px; font-weight: 600; cursor: pointer; font-family: var(--font-body);
}
nav.tabs button svg { width: 20px; height: 20px; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (min-width: 760px) {
  nav.tabs {
    left: 50%; right: auto; transform: translateX(-50%);
    width: min(560px, calc(100% - 36px));
    bottom: 16px; border-radius: 16px; border: 1px solid var(--line);
    box-shadow: var(--shadow); padding: 6px;
  }
}
nav.tabs .badge {
  position: absolute; transform: translate(14px, -4px);
  background: var(--crit); color: #fff; font-family: var(--font-mono);
  font-size: 9px; min-width: 15px; height: 15px; border-radius: 99px; display: grid; place-items: center; padding: 0 3px;
}

/* แผ่นตั้งค่า */
.sheet-bg { position: fixed; inset: 0; background: rgba(8,12,10,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet-bg.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0;
  max-height: 88dvh; overflow: auto;
  background: var(--surface); border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--line); padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(102%); transition: transform .24s cubic-bezier(.3,.8,.3,1);
  display: grid; gap: 14px;
}
.sheet.on { transform: translateY(0); }
@media (min-width: 760px) {
  .sheet { left: auto; right: 18px; bottom: 18px; width: 420px; border-radius: 18px; max-height: 82dvh; }
}
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 700; }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--surface-3); margin: 0 auto 2px; }
.sec-title { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); }
.note { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
.footer-note { grid-column: 1 / -1; font-size: 11px; color: var(--ink-3); text-align: center; padding: 2px 0 4px; line-height: 1.6; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#005F6B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="โรงเห็ด AI">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="เมนูหลัก"></nav>
</div>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="ตั้งค่า"></div>
<div id="toast" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:60;background:var(--surface);border:1px solid var(--good);color:var(--ink);padding:9px 14px;border-radius:11px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center"></div>

<script>/*!
 * AI Smart Mushroom Farm — core engine (simulation + safety + AI)

  function deviation(v, lo, hi) {

    if (v < lo) return (lo - v) / Math.max(0.001, hi - lo);
    return 0;

  function ruleDecide(s) {
    var r = s.reading, tg = s.targets;
    var wants = {};                       // อุปกรณ์ → ต้องการเปิด/ปิด
    var dbT = 0.4, dbH = 1.5;             // ฮิสเทอรีซิสกันสั่งงานถี่

    // ระบบอุณหภูมิ

    else if (r.temp < tg.tMax - dbT) wants.fan = false;

    // ระบบความชื้น
    if (r.humid < tg.hMin) wants.humidifier = true;
    else if (r.humid > tg.hMin + dbH) wants.humidifier = false;

    // อุปกรณ์ที่ใช้ร่วมกัน: ระบายอากาศ — ทั้งสองระบบแย่งกันสั่ง (CTRL-05)
    var wantVentTemp = r.temp > tg.tMax + 1.2;
    var wantVentHumid = r.humid > tg.hMax;
    var devT = deviation(r.temp, tg.tMin, tg.tMax);
    var devH = deviation(r.humid, tg.hMin, tg.hMax);
    if (wantVentTemp || wantVentHumid) {

    }

  }

    s.arbitration.unshift({ t: s.clock, device: 'vent', winner: winner, devT: devT, devH: devH, result: result });

    for (i = 0; i < n; i++) { var e = pts[i].v - (slope * pts[i].t + inter); ssRes += e * e; }
    return { slope: slope, intercept: inter, r2: ssTot ? 1 - ssRes / ssTot : 0, sd: Math.sqrt(ssRes / n), mean: my };
  }

  // Holt's linear trend (double exponential smoothing) — ตัวเลขทั้งหมดมาจากชั้นสถิติ ไม่ใช่ LLM
  function holt(pts, alpha, beta) {
    if (pts.length < 6) return null;
    var level = pts[0].v, trend = pts[1].v - pts[0].v, resid = [];
    for (var i = 1; i < pts.length; i++) {
      var f = level + trend;
      resid.push(pts[i].v - f);
      var prev = level;
      level = alpha * pts[i].v + (1 - alpha) * f;
      trend = beta * (level - prev) + (1 - beta) * trend;
    }
    var sum = 0; resid.slice(-40).forEach(function (e) { sum += e * e; });
    var sd = Math.sqrt(sum / Math.min(40, resid.length));
    return { level: level, trend: trend, sd: sd, step: (pts[pts.length - 1].t - pts[0].t) / (pts.length - 1) };
  }

  // ส่วนประกอบวัฏจักรรายวัน เรียนรู้จากค่าเฉลี่ยรายชั่วโมงย้อนหลัง
  // ต้องมีประวัติอย่างน้อย ~6 ชั่วโมง (72 บักเก็ต) จึงจะเริ่มใช้ ก่อนหน้านั้นคืน 0 (ไม่เดา)
  function diurnal(s, horizonSec, key) {
    if (s.agg.length < 72) return 0;
    var nowSlot = Math.floor((s.clock % 86400) / 3600);
    var futSlot = Math.floor(((s.clock + horizonSec) % 86400) / 3600);
    if (nowSlot === futSlot) return 0;
    var acc = {}, cnt = {};
    s.agg.forEach(function (a) {
      var sl = Math.floor((a.t % 86400) / 3600);
      var v = key === 'temp' ? a.tAvg : a.hAvg;
      acc[sl] = (acc[sl] || 0) + v; cnt[sl] = (cnt[sl] || 0) + 1;
    });
    if (!cnt[nowSlot] || !cnt[futSlot] || cnt[nowSlot] < 3 || cnt[futSlot] < 3) return 0;
    var d = (acc[futSlot] / cnt[futSlot]) - (acc[nowSlot] / cnt[nowSlot]);
    return Math.max(-9, Math.min(9, d));
  }
  function dampedSteps(k, phi) {
    if (k <= 0) return 0;
    return (phi * (1 - Math.pow(phi, k))) / (1 - phi);
  }

  function detectPatterns(s) {
    var out = [];
    var pts = series(s, 'temp', 180);           // 30 นาทีที่ 10 วินาที
    var reg = linreg(pts);
    if (reg) {
      var perHour = reg.slope * 3600;
      if (Math.abs(perHour) > 0.8 && reg.r2 > 0.45) {
        out.push({ kind: 'trend', metric: 'temp', dir: perHour > 0 ? 'up' : 'down',
          rate: perHour, confidence: Math.min(0.97, 0.5 + reg.r2 / 2),
          label: 'อุณหภูมิมีแนวโน้ม' + (perHour > 0 ? 'เพิ่มขึ้น ' : 'ลดลง ') + Math.abs(perHour).toFixed(1) + ' °C/ชม.' });
      }
      // การแกว่ง: นับการกลับทิศ + แอมพลิจูด
      var flips = 0, prevDir = 0, mn = 99, mx = -99;
      for (var i = 1; i < pts.length; i++) {
        var dir = Math.sign(pts[i].v - pts[i - 1].v);
        if (dir !== 0 && prevDir !== 0 && dir !== prevDir) flips++;
        if (dir !== 0) prevDir = dir;
        mn = Math.min(mn, pts[i].v); mx = Math.max(mx, pts[i].v);
      }
      if (pts.length > 60 && flips > 24 && mx - mn > 1.2) {
        out.push({ kind: 'oscillation', metric: 'temp', confidence: Math.min(0.95, 0.45 + flips / 120),
          label: 'อุณหภูมิแกว่ง ' + (mx - mn).toFixed(1) + ' °C ในครึ่งชั่วโมง — ตรวจการตั้งค่าเดดแบนด์' });
      }
    }
    var hp = series(s, 'humid', 180), hreg = linreg(hp);
    if (hreg && Math.abs(hreg.slope * 3600) > 4 && hreg.r2 > 0.5) {
      out.push({ kind: 'trend', metric: 'humid', dir: hreg.slope > 0 ? 'up' : 'down',
        rate: hreg.slope * 3600, confidence: Math.min(0.95, 0.5 + hreg.r2 / 2),
        label: 'ความชื้นมีแนวโน้ม' + (hreg.slope > 0 ? 'เพิ่มขึ้น ' : 'ลดลง ') + Math.abs(hreg.slope * 3600).toFixed(0) + ' %RH/ชม.' });
    }
    // ความผิดปกติเทียบวัฏจักรรายวัน
    if (s.agg.length >= 24 && reg) {
      var slot = Math.floor(((s.clock % 86400) / 3600) * 2), sum = 0, n = 0, sq = 0;
      s.agg.forEach(function (a) {
        if (Math.floor(((a.t % 86400) / 3600) * 2) === slot) { sum += a.tAvg; n++; sq += a.tAvg * a.tAvg; }
      });
      if (n >= 4) {
        var mean = sum / n, sd = Math.sqrt(Math.max(0.01, sq / n - mean * mean));
        var z = (s.reading.temp - mean) / sd;
        if (Math.abs(z) > 2.2) out.push({ kind: 'daily-anomaly', metric: 'temp', confidence: Math.min(0.95, Math.abs(z) / 4),
          label: 'อุณหภูมิต่างจากช่วงเวลาเดียวกันของวันก่อน ' + (z > 0 ? '+' : '') + (s.reading.temp - mean).toFixed(1) + ' °C' });
      }
    }
    return out;
  }

  function makeForecast(s) {
    var PHI = 0.99;                       // แนวโน้มแบบหน่วง กันการคาดการณ์เกินจริงในระยะยาว
    var pts = series(s, 'temp', 240);
    var h = holt(pts, 0.28, 0.06);
    if (!h) return null;
    // ความไม่แน่นอนอ้างอิงจากความคลาดเคลื่อนที่ "วัดได้จริง" เมื่อมีข้อมูลพอ
    var sigT = Math.max(0.45, s.ai.accuracy.mae ? s.ai.accuracy.mae * 1.25 : h.sd * 6);
    function at(sec) {
      var k = sec / Math.max(1, h.step);
      var v = h.level + h.trend * dampedSteps(k, PHI) + diurnal(s, sec, 'temp');
      var band = sigT * Math.sqrt(Math.max(0.2, sec / 3600));
      return { value: v, lo: v - band, hi: v + band, band: band };
    }
    var f1 = at(3600), f6 = at(21600);
    var curve = [];
    for (var i = 1; i <= 12; i++) {
      var sec = (21600 * i) / 12, a = at(sec);
      curve.push({ t: s.clock + sec, v: a.value, lo: a.lo, hi: a.hi });
    }
    var hp = series(s, 'humid', 240), hh = holt(hp, 0.28, 0.06);
    var fh1 = null, hcurve = [];
    if (hh) {
      var sigH = Math.max(1.6, hh.sd * 6);
      var hAt = function (sec) {
        var kk = sec / Math.max(1, hh.step);
        var vv = hh.level + hh.trend * dampedSteps(kk, PHI) + diurnal(s, sec, 'humid');
        vv = Math.max(0, Math.min(100, vv));
        var bb = sigH * Math.sqrt(Math.max(0.2, sec / 3600));
        return { value: vv, lo: Math.max(0, vv - bb), hi: Math.min(100, vv + bb), band: bb };
      };
      var h1 = hAt(3600);
      fh1 = { value: h1.value, lo: h1.lo, hi: h1.hi, band: h1.band };
      for (var j = 1; j <= 6; j++) {
        var s2 = (3600 * j) / 6, b2 = hAt(s2);
        hcurve.push({ t: s.clock + s2, v: b2.value, lo: b2.lo, hi: b2.hi });
      }
    }
    // บันทึกไว้วัดความคลาดเคลื่อนจริงเมื่อถึงเวลา
    s.ai.pending.push({ due: s.clock + 3600, predicted: f1.value });
    if (s.ai.pending.length > 400) s.ai.pending.shift();
    return { at: s.clock, temp1h: f1, temp6h: f6, humid1h: fh1, curve: curve, humidCurve: hcurve,
      sd: h.sd, diurnalReady: s.agg.length >= 72,
      trendPerHour: h.trend * dampedSteps(3600 / Math.max(1, h.step), PHI) };
  }

  function scoreForecastAccuracy(s) {
    var keep = [];
    s.ai.pending.forEach(function (p) {
      if (s.clock >= p.due) {
        s.ai.accuracy.n++;
        s.ai.accuracy.sumAbs += Math.abs(s.reading.temp - p.predicted);
        s.ai.accuracy.mae = s.ai.accuracy.sumAbs / s.ai.accuracy.n;
      } else keep.push(p);
    });
    s.ai.pending = keep;
  }

  function recommend(s) {
    var f = s.ai.forecast, tg = s.targets, r = s.reading;
    if (!f) return null;
    var cands = [];
    var willExceed = f.temp1h.value > tg.tMax + 0.3;
    var willDrop = f.temp1h.value < tg.tMin - 0.3;
    // ความเชื่อมั่น: ยิ่งช่วงความเชื่อมั่นแคบ และยิ่งเบี่ยงเบนชัด ยิ่งมั่นใจ
    function conf(margin, band) {
      var c = 1 - Math.exp(-Math.abs(margin) / Math.max(0.35, band));
      return Math.max(0.15, Math.min(0.96, c));
    }
    if (willExceed) {
      cands.push({ device: 'fan', on: true, target: tg.tMax - 0.5,
        confidence: conf(f.temp1h.value - tg.tMax, f.temp1h.band),
        reason: 'พยากรณ์อีก 1 ชม. อุณหภูมิจะขึ้นถึง ' + f.temp1h.value.toFixed(1) + ' °C ซึ่งเกินเป้าหมาย ' + tg.tMax + ' °C — เปิดพัดลมล่วงหน้าเพื่อไม่ให้เกินเกณฑ์' });
    }
    if (willDrop) {
      cands.push({ device: 'fan', on: false, target: tg.tMin + 0.5,
        confidence: conf(tg.tMin - f.temp1h.value, f.temp1h.band),
        reason: 'พยากรณ์อีก 1 ชม. อุณหภูมิจะลดถึง ' + f.temp1h.value.toFixed(1) + ' °C ต่ำกว่าเป้าหมาย — ปิดพัดลมเพื่อรักษาความอบอุ่น' });
    }
    if (f.humid1h && f.humid1h.value < tg.hMin - 1) {
      cands.push({ device: 'humidifier', on: true, target: tg.hMin + 3,
        confidence: conf(tg.hMin - f.humid1h.value, f.humid1h.band),
        reason: 'พยากรณ์ความชื้นจะลดถึง ' + f.humid1h.value.toFixed(0) + ' %RH ต่ำกว่าเป้าหมาย ' + tg.hMin + ' %RH — เดินเครื่องเพิ่มความชื้นก่อนเห็ดหยุดโต' });
    }
    if (f.humid1h && f.humid1h.value > tg.hMax + 1) {
      cands.push({ device: 'vent', on: true, target: tg.hMax - 2,
        confidence: conf(f.humid1h.value - tg.hMax, f.humid1h.band),
        reason: 'พยากรณ์ความชื้นจะขึ้นถึง ' + f.humid1h.value.toFixed(0) + ' %RH เสี่ยงเชื้อรา — ระบายอากาศเพื่อลดความชื้น' });
    }
    if (!cands.length) {
      return { device: null, on: null, confidence: Math.max(0.2, Math.min(0.95, 1 - f.temp1h.band / 3)),
        action: 'hold', reason: 'ค่าปัจจุบัน ' + r.temp.toFixed(1) + ' °C / ' + r.humid.toFixed(0) + ' %RH และแนวโน้ม 1 ชม. ยังอยู่ในช่วงเป้าหมาย — ไม่ต้องปรับ',
        applied: false, at: s.clock };
    }
    cands.sort(function (a, b) { return b.confidence - a.confidence; });
    var top = cands[0];
    top.action = (top.on ? 'เปิด' : 'ปิด') + ' ' + deviceName(top.device);
    top.applied = false; top.at = s.clock;
    return top;
  }

  function deviceName(id) {
    var d = DEVICES.filter(function (x) { return x.id === id; })[0];
    return d ? d.name : id;
  }

  function runAI(s) {
    if (!s.ai.online) { s.ai.pattern = []; s.ai.forecast = null; s.ai.recommendation = null; return; }
    s.ai.pattern = detectPatterns(s);
    s.ai.forecast = makeForecast(s);
    var rec = recommend(s);
    // เก็บสถานะ "อนุมัติแล้ว" ของคำแนะนำเดิมถ้าเป็นข้อเดียวกัน
    var old = s.ai.recommendation;
    if (old && rec && old.device === rec.device && old.on === rec.on && old.applied) rec.applied = true;
    s.ai.recommendation = rec;
    s.ai.lastRun = s.clock;

    // AIAN-03/05: ต่ำกว่าเกณฑ์ความเชื่อมั่นห้ามสั่งงานเอง ไม่ว่าโหมดใด
    if (rec && rec.device && s.ai.autoApply && rec.confidence >= C.CONF_GATE && !rec.applied) {
      var res = sendCommand(s, rec.device, rec.on, 'ai');
      if (res.ok) { rec.applied = true; s.stats.autoApplied++; }
    }
  }

  function approveRecommendation(s) {
    var rec = s.ai.recommendation;
    if (!rec || !rec.device) return { ok: false, reason: 'ไม่มีคำแนะนำที่ต้องอนุมัติ' };
    if (s.role === 'viewer') return { ok: false, reason: 'บัญชีนี้ดูข้อมูลได้อย่างเดียว' };
    var res = sendCommand(s, rec.device, rec.on, 'manual');
    if (res.ok) rec.applied = true;
    return res;
  }

  // ───────────────────────── Computer Vision (จำลอง) ─────────────────────────
  function cvCycle(s) {
    var wasHarvestReady = !!(s.cv.metrics && s.cv.metrics.harvest);
    s.cv.nextCapture = s.clock + C.CV_INTERVAL;
    var r = s._rnd;
    if (s.scenario.cameraFail) {           // FAIL-04
      s.cv.skipped++;
      s.cv.quality = { ok: false, brightness: 4 + r() * 6, blur: 0.8 + r() * 0.2, note: 'ภาพมืด/เบลอเกินเกณฑ์' };
      raiseAlert(s, 'camera-fail', 'warning', 'กล้องส่งภาพไม่ได้คุณภาพ — ข้ามการวิเคราะห์รอบนี้ (' + s.cv.skipped + ' รอบต่อเนื่อง)');
      return;
    }
    s.cv.quality = { ok: true, brightness: 118 + r() * 40, blur: 0.05 + r() * 0.08, note: 'ผ่านเกณฑ์ความสว่างและความคมชัด' };
    s.cv.cycles++; s.cv.skipped = 0;
    s.cv.lastCapture = s.clock;

    var b = s.growth.biomass;
    var count = Math.max(3, Math.round(b * 26 + gauss(r) * 1.2));
    var size = Math.max(0.6, b * 7.4 + gauss(r) * 0.18);
    var coverage = Math.max(2, Math.min(96, b * 74 + gauss(r) * 1.5));
    var stage = size < 2 ? 'pin' : size < 4 ? 'young' : size < 7 ? 'mature' : 'overmature';
    var stageTh = { pin: 'ระยะดอกเข็ม', young: 'ระยะอ่อน', mature: 'ระยะโตเต็มที่', overmature: 'ระยะแก่เกิน' }[stage];
    var harvest = (stage === 'mature' && size >= 4.6) || stage === 'overmature';

    // ความผิดปกติสัมพันธ์กับสภาพแวดล้อมที่ผ่านมา
    var anomalies = [];
    if (s.reading.humid > 92) anomalies.push({ cls: 'mold', label: 'เชื้อราขึ้นผิวดอก', p: Math.min(0.94, 0.35 + (s.reading.humid - 92) * 0.09) });
    if (s.reading.humid < 68) anomalies.push({ cls: 'stunted', label: 'ดอกแคระ/แตกลาย', p: Math.min(0.9, 0.3 + (68 - s.reading.humid) * 0.05) });
    if (s.reading.temp > 31) anomalies.push({ cls: 'discolor', label: 'สีผิดปกติจากความร้อน', p: Math.min(0.9, 0.28 + (s.reading.temp - 31) * 0.1) });
    if (stage === 'overmature') anomalies.push({ cls: 'rot', label: 'เริ่มเน่าเพราะเก็บช้า', p: 0.55 });

    var dets = [];
    for (var i = 0; i < count; i++) {
      var rr = 0.30 + (size / 8) * (0.44 + r() * 0.42);
      dets.push({ x: 0.07 + r() * 0.86, y: 0.14 + r() * 0.76, r: rr,
        stage: stage, conf: 0.74 + r() * 0.24,
        bad: anomalies.length && r() < Math.min(0.35, anomalies[0].p * 0.4) });
    }
    s.cv.metrics = { count: count, size: size, coverage: coverage, stage: stage, stageTh: stageTh,
      harvest: harvest, anomalies: anomalies, at: s.clock,
      color: s.reading.temp > 31 ? 'เหลืองคล้ำ' : 'ครีมอมเทา (ปกติ)' };
    s.cv.detections = dets;
    s.cv.history.push({ t: s.clock, count: count, size: size, coverage: coverage });
    if (s.cv.history.length > 240) s.cv.history.shift();

    if (harvest && !wasHarvestReady)
      raiseAlert(s, 'harvest', 'good', 'เห็ดถึงเกณฑ์พร้อมเก็บเกี่ยว (ขนาดเฉลี่ย ' + size.toFixed(1) + ' ซม.) — แนะนำให้เก็บภายในวันนี้');
    if (anomalies.length && anomalies[0].p > 0.6)
      raiseAlert(s, 'cv-anomaly-' + anomalies[0].cls, 'warning', 'ตรวจพบความผิดปกติ: ' + anomalies[0].label + ' (ความเชื่อมั่น ' + Math.round(anomalies[0].p * 100) + '%)');
  }

  function harvestNow(s) {
    if (!s.cv.metrics) return { ok: false, reason: 'ยังไม่มีผลวิเคราะห์ภาพ' };
    s.growth.biomass = 0.08; s.growth.flush++; s.growth.goodSeconds = 0;
    s.cv.metrics = null; s.cv.detections = []; s.cv.history = [];
    s.cv.nextCapture = s.clock + 60;
    raiseAlert(s, 'harvested', 'good', 'บันทึกการเก็บเกี่ยวรุ่นที่ ' + (s.growth.flush - 1) + ' เรียบร้อย — เริ่มรอบใหม่');
    return { ok: true };
  }

  function growthUpdate(s, dt) {
    var r = s.reading, tg = s.targets;
    var inRange = r.valid && r.temp >= tg.tMin - 1 && r.temp <= tg.tMax + 1 && r.humid >= tg.hMin - 3 && r.humid <= tg.hMax + 3;
    if (inRange) {
      s.growth.goodSeconds += dt;
      s.growth.biomass = Math.min(1.25, s.growth.biomass + dt * 3.4e-6);
    } else {
      s.growth.biomass = Math.min(1.25, s.growth.biomass + dt * 0.6e-6);
    }
  }

  // ───────────────────────── ลูปหลัก ─────────────────────────
  function step(s, dtSim) {
    var remaining = dtSim;
    var guard = 0;
    while (remaining > 0.0001 && guard++ < 200000) {
      var dt = Math.min(C.READ_INTERVAL, remaining);
      remaining -= dt;
      s.clock += dt;
      s.day = 1 + Math.floor(s.clock / 86400);

      physics(s, dt);

      var pkt = readSensor(s);
      if (pkt) {
        var flags = validate(s, pkt);
        var bad = flags.length > 0;
        if (flags.indexOf('signature') >= 0 || flags.indexOf('range-temp') >= 0 || flags.indexOf('range-humid') >= 0) {
          s.sensor.rejected++;              // ปฏิเสธ แต่ยังนับว่าอุปกรณ์ยังติดต่อได้
          s.sensor.lastSeen = s.clock;
        } else {
          s.sensor.accepted++;
          if (bad) s.sensor.flagged++;
          s.reading = { temp: pkt.temp, humid: pkt.humid, at: s.clock, valid: true, flags: flags };
          s.sensor.lastSeen = s.clock;
          pushHistory(s, { t: s.clock, temp: pkt.temp, humid: pkt.humid, flag: bad ? 1 : 0 });
        }
      }

      updateDevices(s, dt);
      if (isStale(s) && !s.safeState.active && s.clock - s.sensor.lastSeen > C.STALE) {
        enterSafeState(s, 'ข้อมูลเซนเซอร์ค้างเกิน 5 นาที');
      }
      checkAlerts(s);
      applyControl(s);
      growthUpdate(s, dt);
      scoreForecastAccuracy(s);

      if (s.scenario.aiFail) s.ai.online = false;
      else if (!s.ai.online) { s.ai.online = true; }

      if (s.clock - s.ai.lastRun >= 60) runAI(s);
      if (s.clock >= s.cv.nextCapture) cvCycle(s);
    }
    return s;
  }

  function setScenario(s, key, value) {
    s.scenario[key] = value;
    if (key === 'sensorFail' && !value) s.sensor.lastSeen = s.clock;
    if (key === 'aiFail') s.ai.online = !value;
    if (key === 'cameraFail' && !value) s.cv.nextCapture = s.clock + 5;
    return s;
  }

  function setTargets(s, patch) {
    var t = Object.assign({}, s.targets, patch);
    var errs = [];
    if (t.tMin >= t.tMax) errs.push('อุณหภูมิต่ำสุดต้องน้อยกว่าสูงสุด');
    if (t.hMin >= t.hMax) errs.push('ความชื้นต่ำสุดต้องน้อยกว่าสูงสุด');

    }

  // ───────────────────────── ภาพจำลองจากกล้อง ─────────────────────────
  function drawCV(cv) {
    var w = cv.clientWidth, h = Math.round(w * 3 / 4);

    for (var i = 0; i < 900; i++) {
      x.fillStyle = 'rgba(' + (90 + rnd() * 60 | 0) + ',' + (78 + rnd() * 50 | 0) + ',' + (62 + rnd() * 40 | 0) + ',' + (0.06 + rnd() * 0.16) + ')';
      x.fillRect(rnd() * w, rnd() * h, 1.6 + rnd() * 2.6, 1.2 + rnd() * 2);

    dets.forEach(function (d) {

      x.fillStyle = cg;
      x.beginPath(); x.ellipse(cx, cy, r * 1.12, r * 0.80, 0, Math.PI, 0); x.fill();
      x.beginPath(); x.ellipse(cx, cy, r * 1.12, r * 0.30, 0, 0, Math.PI); x.fill();
    });

    dets.forEach(function (d, i) {

      var bx = cx - r * 1.3, by = cy - r * 1.0, bw = r * 2.6, bh = r * 2.5;

        var tw = x.measureText(lab).width + 6;
        x.fillStyle = d.bad ? 'rgba(240,121,107,.92)' : 'rgba(92,194,212,.92)';
        x.fillRect(bx, by - 12, tw, 12);
        x.fillStyle = '#0b1412'; x.textAlign = 'left';
        x.fillText(lab, bx + 3, by - 3);
      }
    });
    // แสงจากมุมกล้อง
    var vg = x.createRadialGradient(w * .5, h * .35, w * .1, w * .5, h * .5, w * .78);
    vg.addColorStop(0, 'rgba(255,255,255,.06)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
    x.fillStyle = vg; x.fillRect(0, 0, w, h);
  }

  // ───────────────────────── ส่วนประกอบ ─────────────────────────
  function statusPill(kind, text, icon) {
    return '<span class="pill ' + kind + '">' + (icon ? ico(icon) : '<i class="dot"></i>') + esc(text) + '</span>';
  }
  function confBar(c) {
    var low = c < Core.C.CONF_GATE;
    return '<div class="conf"><div class="conf-bar"><i class="' + (low ? 'low' : '') + '" style="width:' + Math.round(c * 100) + '%"></i></div>' +
      '<div class="conf-note"><span class="gate">ความเชื่อมั่น ' + (c * 100).toFixed(0) + '%</span> · ' +
      (low ? 'ต่ำกว่าเกณฑ์ 60% → ระบบจะไม่สั่งงานเอง ต้องให้ผู้ดูแลอนุมัติ' : 'ผ่านเกณฑ์ 60% → สั่งงานอัตโนมัติได้ถ้าเปิดโหมดนั้น') + '</div></div>';
  }
  function tempStatus() { return Core.statusOf(S.reading.temp, S.targets.tMin, S.targets.tMax, S.thresholds.tLo, S.thresholds.tHi); }
  function humidStatus() { return Core.statusOf(S.reading.humid, S.targets.hMin, S.targets.hMax, S.thresholds.hLo, S.thresholds.hHi); }
  var STATUS_TH = { good: 'อยู่ในช่วงเป้าหมาย', warning: 'นอกช่วงเป้าหมาย', critical: 'เกินเกณฑ์วิกฤต' };
  var PILL = { good: 'good', warning: 'warn', critical: 'crit' };

  function banners() {
    var out = '';

      out += '<div class="card wide"><div class="banner crit">' + ico('warn') +
        '<div><b>ระบบอยู่ในสถานะปลอดภัย (Safe-State)</b>' + esc(S.safeState.reason) +
        ' — พัดลมและเครื่องเพิ่มความชื้นถูกปิด ระบบระบายอากาศถูกเปิดไว้ ระบบจะไม่กลับไปทำงานอัตโนมัติจนผู้ดูแลกดรับทราบ' +
        '<div><button class="btn sm primary" data-act="ackSafe">รับทราบและกลับสู่อัตโนมัติ</button></div></div></div></div>';
    }
    if (!S.ai.online) {
      out += '<div class="card wide"><div class="banner warn">' + ico('shield') +
        '<div><b>บริการ AI ไม่พร้อมใช้งาน</b>ระบบสลับไปใช้ตัวควบคุมตามกฎอัตโนมัติแล้ว การควบคุมอุณหภูมิและความชื้นยังทำงานปกติ (ไม่มีการพยากรณ์และคำแนะนำในช่วงนี้)</div></div></div>';
    }

        '<div><b>ข้อมูลเซนเซอร์ค้าง</b>ไม่ได้รับค่าใหม่ ' + Math.round(S.clock - S.sensor.lastSeen) + ' วินาที — ระบบค้างคำสั่งล่าสุดไว้และหยุดออกคำสั่งใหม่</div></div></div>';

  // ───────────────────────── หน้าตรวจวัด ─────────────────────────
  function viewMonitor() {
    var ts = tempStatus(), hs = humidStatus();
    var r = S.reading;
    var last24 = S.agg.filter(function (a) { return a.t > S.clock - 86400; });
    var tMinD = last24.length ? Math.min.apply(null, last24.map(function (a) { return a.tMin; })) : r.temp;
    var tMaxD = last24.length ? Math.max.apply(null, last24.map(function (a) { return a.tMax; })) : r.temp;
    var inRange = 0, tot = 0;
    S.raw.forEach(function (x) {
      tot++;
      if (x.temp >= S.targets.tMin && x.temp <= S.targets.tMax && x.humid >= S.targets.hMin && x.humid <= S.targets.hMax) inRange++;
    });
    var pct = tot ? Math.round((inRange / tot) * 100) : 0;
    var alerts24 = S.alerts.filter(function (a) { return a.t > S.clock - 86400; }).length;
    var conn = Core.connection(S);
    var connMap = { online: ['good', 'เชื่อมต่อปกติ'], stale: ['warn', 'ข้อมูลค้าง'], offline: ['crit', 'ขาดการเชื่อมต่อ'] };

    var html = banners();
    html += '<div class="card hero temp">' +
      '<div class="hero-top"><div style="flex:1"><div class="hero-label">อุณหภูมิในโรงเรือน</div>' +
      '<div class="readout"><span class="v">' + r.temp.toFixed(1) + '</span><span class="u">°C</span></div></div>' +
      statusPill(PILL[ts], STATUS_TH[ts]) + '</div>' +
      '<canvas class="spark" data-spark="temp"></canvas>' +
      '<div class="meta"><span>เป้าหมาย <b>' + S.targets.tMin + '–' + S.targets.tMax + ' °C</b></span>' +
      '<span>ต่ำ/สูงสุด 24 ชม. <b>' + tMinD.toFixed(1) + ' / ' + tMaxD.toFixed(1) + '</b></span>' +
      '<span>อัปเดต <b>' + Math.round(S.clock - r.at) + ' วิ.ที่แล้ว</b></span></div></div>';

    html += '<div class="card hero humid">' +
      '<div class="hero-top"><div style="flex:1"><div class="hero-label">ความชื้นสัมพัทธ์</div>' +
      '<div class="readout"><span class="v">' + r.humid.toFixed(0) + '</span><span class="u">%RH</span></div></div>' +
      statusPill(PILL[hs], STATUS_TH[hs]) + '</div>' +
      '<canvas class="spark" data-spark="humid"></canvas>' +
      '<div class="meta"><span>เป้าหมาย <b>' + S.targets.hMin + '–' + S.targets.hMax + ' %RH</b></span>' +
      '<span>เกณฑ์เตือน <b>&lt;' + S.thresholds.hLo + ' / &gt;' + S.thresholds.hHi + '</b></span></div></div>';

    html += '<div class="card wide"><div class="head">' + '<h2>สรุปการทำงาน</h2>' +
      statusPill(connMap[conn][0], connMap[conn][1], 'wifi') + '</div>' +
      '<div class="kpis">' +
      kpi('เวลาที่อยู่ในช่วงเป้าหมาย', pct + '%') +
      kpi('คำสั่งอุปกรณ์ทั้งหมด', S.stats.commands) +
      kpi('แจ้งเตือน 24 ชม.', alerts24) +
      kpi('แพ็กเก็ตที่ปฏิเสธ', S.sensor.rejected) +
      '</div>' +
      '<div class="chipline" style="margin-top:10px">' + Core.DEVICES.map(function (d) {
        var dv = S.devices[d.id];
        return '<span class="pill ' + (dv.on ? 'good' : 'quiet') + '">' + ico(d.icon) + esc(d.name) + ' · ' + (dv.on ? 'ทำงาน' : 'หยุด') + '</span>';
      }).join('') + '</div></div>';

    html += '<div class="card wide"><div class="head">' + '<h2>แจ้งเตือนล่าสุด</h2>' +
      '<span class="pill quiet">' + ico('bell') + 'รวบซ้ำทุก 15 นาที</span></div>' + alertList(4) + '</div>';
    return html;
  }
  function kpi(k, n) { return '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="n">' + esc(String(n)) + '</div></div>'; }
  function alertList(n) {
    var a = S.alerts.slice(0, n);
    if (!a.length) return '<div class="empty">ยังไม่มีการแจ้งเตือน — ค่าทั้งหมดอยู่ในเกณฑ์</div>';
    return '<div class="list">' + a.map(function (x) {
      var k = x.level === 'critical' ? 'crit' : x.level === 'warning' ? 'warn' : 'good';
      return '<div class="item"><span class="when">' + hhmm(x.t) + '</span>' +

        ' ' + esc(x.message) + '</span></div>';
    }).join('') + '</div>';
  }

  function fcPoints(kind) {

    html += '<div class="card wide"><h2 style="color:var(--humid)">ความชื้นสัมพัทธ์</h2>' +
      '<div class="chart-wrap"><canvas class="chart" data-chart="humid"></canvas><div class="tip" id="tip-humid"></div></div>' +

  // ───────────────────────── หน้าควบคุม ─────────────────────────
  function viewControl() {
    var html = banners();
    html += '<div class="card wide"><div class="head"><h2>อุปกรณ์ในโรงเรือน</h2>' +
      '<span class="pill quiet">' + ico('clock') + '1 คำสั่ง/30 วินาที</span></div>';
    html += Core.DEVICES.map(function (d) {
      var dv = S.devices[d.id];
      var manualLeft = Math.max(0, Math.ceil(dv.manualUntil - S.clock));
      var gapLeft = Math.max(0, Math.ceil(Core.C.CMD_GAP - (S.clock - dv.lastCommandAt)));
      var note = dv.pending ? 'รอการตอบรับ… (ลองซ้ำ ' + dv.retries + '/3)' :
        dv.unresponsive ? 'ไม่ตอบสนอง — อยู่ในสถานะปลอดภัย' :

        '<div class="row">' +

        '<button class="btn sm ' + (dv.on ? 'primary' : '') + '" data-act="cmd" data-dev="' + d.id + '" data-on="0"' + (!dv.on || dv.unresponsive || S.role === 'viewer' ? ' disabled' : '') + '>ปิด</button>' +

    html += '<div class="card"><h2>ช่วงเป้าหมายต่อโซน</h2><p class="sub">โซน A — โรงเรือนหลัก (อุณหภูมิ 10–35 °C, ความชื้น 50–95 %RH)</p>' +
      '<div class="grid2">' +
      numField('tMin', 'อุณหภูมิต่ำสุด (°C)', S.targets.tMin, 10, 35, 0.5) +

      numField('hMin', 'ความชื้นต่ำสุด (%RH)', S.targets.hMin, 50, 95, 1) +

      '<div class="row" style="margin-top:10px"><button class="btn primary" data-act="saveTargets"' + (S.role === 'viewer' ? ' disabled' : '') + '>บันทึกเป้าหมาย</button></div></div>';

    html += '<div class="card"><h2>การตัดสินคำสั่งขัดแย้ง</h2><p class="sub">ระบบระบายอากาศถูกใช้ร่วมกันระหว่างการคุมอุณหภูมิและความชื้น ฝ่ายที่เบี่ยงเบนจากเป้าหมายมากกว่าเป็นผู้ชนะ</p>' +

      }).join('') + '</div>' : '<div class="empty">ยังไม่มีคำสั่งขัดแย้ง</div>') + '</div>';

    html += '<div class="card wide"><h2>ประวัติคำสั่ง</h2><div class="tblbox"><table class="data"><thead><tr><th>เวลา</th><th>อุปกรณ์</th><th>เหตุการณ์</th><th>สั่งโดย</th></tr></thead><tbody>' +
      S.commandLog.slice(0, 40).map(function (l) {

  function numField(k, label, v, mn, mx, st) {

        '<div class="meta" style="margin-top:9px"><span>ช่วงความเชื่อมั่น 1 ชม. <b>' + f.temp1h.lo.toFixed(1) + '–' + f.temp1h.hi.toFixed(1) + ' °C</b></span>' +

        (f.diurnalReady ? ' (เรียนรู้จากประวัติแล้ว)' : ' (ยังเก็บประวัติไม่ถึง 6 ชม. จึงยังไม่ใช้ส่วนวัฏจักรรายวัน)') +

    html += '<div class="card wide"><div class="head"><h2>คำแนะนำการปรับสภาพแวดล้อม</h2>' +

    else {
      html += '<div style="font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:4px">' +

    }
    html += '</div>';
    return html;
  }

      '<p class="sub" style="margin-top:8px">ถ่ายภาพทุก 30 นาที · รอบถัดไปในอีก ' + fmtDur(Math.max(0, Math.ceil(S.cv.nextCapture - S.clock))) +
      ' · วิเคราะห์สำเร็จ ' + S.cv.cycles + ' รอบ' + (S.cv.skipped ? ' · ข้าม ' + S.cv.skipped + ' รอบ' : '') + '</p>';

    }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isStandalone() {
    try {
      return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    } catch (e) { return false; }
  }
  function installBlock() {
    if (isStandalone() || installedPWA) {
      return '<div><div class="sec-title">แอปบนเครื่อง</div>' +
        '<p class="note" style="margin-top:8px">ติดตั้งลงเครื่องเรียบร้อยแล้ว — เปิดจากไอคอนบนหน้าจอโฮมได้เลย ' +

      return '<div><div class="sec-title">ติดตั้งลงเครื่อง</div>' +
        '<p class="note" style="margin-top:8px">เพิ่มไอคอนแอปบนหน้าจอโฮม เปิดแบบเต็มจอ และใช้ได้แม้ไม่มีอินเทอร์เน็ต</p>' +

        'จะได้ไอคอนแอปบนหน้าจอ เปิดแบบเต็มจอและใช้ได้แม้ไม่มีเน็ต</p></div>';

  var TABS = [
    ['monitor', 'ตรวจวัด', 'thermo'],
    ['trends', 'แนวโน้ม', 'chart'],
    ['control', 'ควบคุม', 'sliders'],
    ['ai', 'AI', 'brain'],

  ];

  var pointerDown = false;
  function render() {
    var ae = document.activeElement;

    var f = Core.fmtClock(S.clock);
    var conn = Core.connection(S);

    var top = document.getElementById('top');
    top.innerHTML =
      '<div class="top-row"><div class="brand"><b>Smart Mushroom Farm</b><span>ทีม โจรสลัดพิกเซล</span></div>' +
      '<span class="spacer"></span>' +
      '<span class="pill ' + connMap[conn][0] + '"><i class="dot ' + (conn === 'online' ? 'live' : '') + '"></i>' + connMap[conn][1] + '</span>' +
      '<button class="iconbtn" data-act="openSheet" aria-label="ตั้งค่า">' + ico('gear') + '</button></div>' +
      '<div class="top-row"><span class="clock">' + ico('clock') + 'วันที่ ' + f.day + ' · ' + f.hhmm + ' (เวลาจำลอง)</span>' +
      '<span class="spacer"></span>' +
      '<button class="iconbtn" data-act="run" aria-pressed="' + (S.running ? 'false' : 'true') + '" aria-label="' + (S.running ? 'หยุดชั่วคราว' : 'เดินระบบต่อ') + '">' + ico(S.running ? 'pause' : 'play') + '</button>' +
      '<div class="seg" role="group" aria-label="ความเร็วการจำลอง">' +
      [[1, '×1'], [6, '×6'], [60, '×60']].map(function (s) {
        return '<button data-act="speed" data-v="' + s[0] + '" aria-pressed="' + (S.speed === s[0]) + '">' + s[1] + '</button>';
      }).join('') + '</div></div>';

    if (!typing) {
      var main = document.getElementById('main');
      main.innerHTML =
        (view === 'monitor' ? viewMonitor() :
         view === 'trends' ? viewTrends() :
         view === 'control' ? viewControl() :
         view === 'ai' ? viewAI() : viewCV()) +
        '<p class="footer-note">ข้อมูลในแอปนี้มาจากแบบจำลองโรงเรือนเพาะเห็ด เพื่อสาธิตตรรกะควบคุมและ AI ก่อนติดตั้งเซนเซอร์จริง<br>' +
        'AI Smart Mushroom Farm · ทีม โจรสลัดพิกเซล · UP AI Hackathon 2026</p>';
      wireCanvases();
    }

    var unread = S.alerts.filter(function (a) { return a.t > lastSeenAlerts; }).length;
    document.getElementById('tabs').innerHTML = TABS.map(function (t) {
      var badge = (t[0] === 'monitor' && unread && view !== 'monitor') ? '<span class="badge">' + Math.min(9, unread) + '</span>' : '';
      return '<button data-act="tab" data-v="' + t[0] + '"' + (view === t[0] ? ' aria-current="page"' : '') + '>' + ico(t[2]) + badge + '<span>' + t[1] + '</span></button>';
    }).join('');

    var sh = document.getElementById('sheet');

    sh.className = 'sheet' + (sheetOpen ? ' on' : '');
    document.getElementById('sheetbg').className = 'sheet-bg' + (sheetOpen ? ' on' : '');

    var tEl = document.getElementById('toast');
    if (toast && performance.now() - toastAt < 3400) {
      tEl.textContent = toast.msg;
      tEl.style.opacity = '1';
      tEl.style.borderColor = toast.kind === 'err' ? 'var(--crit)' : 'var(--good)';
    } else { tEl.style.opacity = '0'; toast = null; }

  function wireCanvases() {
    document.querySelectorAll('canvas[data-spark]').forEach(function (cv) {
      drawSpark(cv, cv.getAttribute('data-spark'), cv.getAttribute('data-spark') === 'temp' ? css('--temp') : css('--humid'));
    });
    document.querySelectorAll('canvas[data-chart]').forEach(function (cv) {
      var kind = cv.getAttribute('data-chart');
      if (kind === 'temp') drawChart(cv, { id: 'temp', points: pickSeries('temp'), forecast: fcPoints('temp'), band: { lo: S.targets.tMin, hi: S.targets.tMax }, color: css('--temp'), fill: css('--temp-fill'), unit: '°C', label: 'อุณหภูมิ', dec: 1, minSpan: 2 });
      if (kind === 'humid') drawChart(cv, { id: 'humid', points: pickSeries('humid'), forecast: fcPoints('humid'), band: { lo: S.targets.hMin, hi: S.targets.hMax }, color: css('--humid'), fill: css('--humid-fill'), unit: '%RH', label: 'ความชื้น', dec: 0, minSpan: 6, clamp: [0, 100] });
      if (kind === 'cvcount') drawChart(cv, { id: 'cvcount', points: S.cv.history.map(function (h) { return { t: h.t, v: h.count }; }), color: css('--accent'), fill: 'rgba(0,0,0,0.06)', unit: 'ดอก', label: 'จำนวนดอก', dec: 0, minSpan: 3 });
      if (kind === 'cvsize') drawChart(cv, { id: 'cvsize', points: S.cv.history.map(function (h) { return { t: h.t, v: h.size }; }), color: css('--temp'), fill: css('--temp-fill'), unit: 'ซม.', label: 'ขนาดเฉลี่ย', dec: 1, minSpan: 1 });
      if (!cv._wired) {
        cv._wired = true;
        var move = function (e) {
          var rect = cv.getBoundingClientRect();
          var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
          hover[kind] = cx; render();
        };
        cv.addEventListener('pointermove', move);
        cv.addEventListener('touchmove', move, { passive: true });
        cv.addEventListener('pointerleave', function () { hover[kind] = null; render(); });
        cv.addEventListener('touchend', function () { hover[kind] = null; render(); });
      }
    });
    var cvv = document.querySelector('canvas[data-cv]');
    if (cvv) drawCV(cvv);
  }

  // ───────────────────────── เหตุการณ์ ─────────────────────────
  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'tab') { view = el.getAttribute('data-v'); if (view === 'monitor') lastSeenAlerts = S.clock; hover = {}; render(); return; }
    if (act === 'speed') { S.speed = +el.getAttribute('data-v'); render(); return; }
    if (act === 'run') { S.running = !S.running; render(); return; }
    if (act === 'win') { win = +el.getAttribute('data-v'); render(); return; }
    if (act === 'toggleTable') { showTable = !showTable; render(); return; }
    if (act === 'openSheet') { sheetOpen = true; render(); return; }
    if (act === 'closeSheet') { sheetOpen = false; render(); return; }
    if (act === 'cmd') {
      var r = Core.sendCommand(S, el.getAttribute('data-dev'), el.getAttribute('data-on') === '1', 'manual');
      say(r.ok ? 'ส่งคำสั่งแล้ว — รอการตอบรับภายใน 5 วินาที' : r.reason, r.ok ? 'ok' : 'err');
      return;
    }
    if (act === 'release') { Core.releaseManual(S, el.getAttribute('data-dev')); say('คืนอุปกรณ์สู่การควบคุมอัตโนมัติแล้ว', 'ok'); return; }
    if (act === 'ackDev') { Core.acknowledgeDevice(S, el.getAttribute('data-dev')); say('รับทราบความผิดพลาดของอุปกรณ์แล้ว', 'ok'); return; }
    if (act === 'ackSafe') {
      var res = Core.acknowledgeSafeState(S);
      say(res.ok ? 'กลับสู่การควบคุมอัตโนมัติแล้ว' : res.reason, res.ok ? 'ok' : 'err');
      return;
    }
    if (act === 'autoApply') {
      S.ai.autoApply = !S.ai.autoApply;
      say(S.ai.autoApply ? 'เปิดโหมดให้ AI สั่งงานอัตโนมัติ (เฉพาะคำแนะนำที่ความเชื่อมั่น ≥ 60%)' : 'ปิดโหมดอัตโนมัติ — ทุกคำแนะนำต้องอนุมัติเอง', 'ok');
      return;
    }
    if (act === 'approve') {
      var ar = Core.approveRecommendation(S);
      say(ar.ok ? 'อนุมัติและส่งคำสั่งแล้ว' : ar.reason, ar.ok ? 'ok' : 'err');
      return;
    }
    if (act === 'dismiss') { if (S.ai.recommendation) S.ai.recommendation.applied = true; say('บันทึกว่าไม่ดำเนินการแล้ว', 'ok'); return; }
    if (act === 'harvest') { var hr = Core.harvestNow(S); say(hr.ok ? 'บันทึกการเก็บเกี่ยวแล้ว — เริ่มรอบเพาะใหม่' : hr.reason, hr.ok ? 'ok' : 'err'); return; }
    if (act === 'scen') {
      var k = el.getAttribute('data-k');
      Core.setScenario(S, k, !S.scenario[k]);
      say('ปรับสถานการณ์ทดสอบแล้ว', 'ok');
      return;
    }
    if (act === 'saveTargets') {
      var patch = {};
      ['tMin', 'tMax', 'hMin', 'hMax'].forEach(function (kk) {
        var inp = document.querySelector('[data-target="' + kk + '"]');
        if (inp) patch[kk] = parseFloat(inp.value);
      });
      var out = Core.setTargets(S, patch);
      formErr = out.ok ? '' : out.errors.join(' · ');
      say(out.ok ? 'บันทึกช่วงเป้าหมายแล้ว' : formErr, out.ok ? 'ok' : 'err');
      return;
    }
    if (act === 'saveTh') {
      ['tLo', 'tHi', 'hLo', 'hHi'].forEach(function (kk) {
        var inp = document.querySelector('[data-th="' + kk + '"]');
        if (inp && inp.value !== '') S.thresholds[kk] = parseFloat(inp.value);
      });
      say('บันทึกเกณฑ์แจ้งเตือนแล้ว', 'ok');
      return;
    }
    if (act === 'export') { exportOpen = !exportOpen; render(); return; }
    if (act === 'copyJson') {
      var ta = document.getElementById('jsonbox');
      if (!ta) return;
      ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e2) {}
      if (navigator.clipboard && !done) {
        navigator.clipboard.writeText(ta.value).then(function () { say('คัดลอกข้อมูล JSON แล้ว', 'ok'); },
          function () { say('คัดลอกอัตโนมัติไม่ได้ — กดค้างในกล่องข้อความเพื่อคัดลอกเอง', 'err'); });
      } else say(done ? 'คัดลอกข้อมูล JSON แล้ว' : 'กดค้างในกล่องข้อความเพื่อคัดลอกเอง', done ? 'ok' : 'err');
      return;
    }
    if (act === 'install') {
      if (!installPrompt) { say('เบราว์เซอร์นี้ยังไม่พร้อมติดตั้ง — ดูวิธีติดตั้งด้วยมือในหน้านี้', 'err'); return; }
      installPrompt.prompt();
      installPrompt.userChoice.then(function (r) {
        if (r && r.outcome === 'accepted') { installedPWA = true; say('ติดตั้งแอปลงเครื่องแล้ว', 'ok'); }
        installPrompt = null; render();
      });
      return;
    }
    if (act === 'reset') {
      S = Core.createState({ seed: (Date.now() % 100000) | 0 });
      try { localStorage.removeItem(KEY); } catch (err) {}
      sheetOpen = false; say('เริ่มการจำลองใหม่แล้ว', 'ok');
      return;
    }
  }

  function onChange(e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'role') { S.role = el.value; say('เปลี่ยนบทบาทเป็น ' + el.options[el.selectedIndex].text, 'ok'); }
    if (act === 'theme') {
      if (el.value === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', el.value);
      try { localStorage.setItem('smartfarm.theme', el.value); } catch (err) {}
      render();
    }
    if (act === 'afail') { Core.setScenario(S, 'actuatorFail', el.value); say(el.value ? 'ตั้งให้อุปกรณ์ไม่ตอบรับคำสั่ง' : 'ยกเลิกการจำลองอุปกรณ์เสีย', 'ok'); }
  }

  // ───────────────────────── ลูปเวลา ─────────────────────────
  var lastFrame = 0, lastRender = 0, lastSave = 0;
  function frame(now) {
    if (!lastFrame) lastFrame = now;
    var dtReal = Math.min(0.5, (now - lastFrame) / 1000);
    lastFrame = now;
    if (S.running) Core.step(S, dtReal * 10 * S.speed);   // 1 วินาทีจริง = 10 วินาทีจำลอง ที่ ×1
    if (now - lastRender > 240) { lastRender = now; render(); }
    if (now - lastSave > 5000) { lastSave = now; save(); }
    requestAnimationFrame(frame);
  }

  function boot() {
    try {
      var th = localStorage.getItem('smartfarm.theme');
      if (th && th !== 'auto') document.documentElement.setAttribute('data-theme', th);
    } catch (e) {}
    S = load() || Core.createState({ seed: 20260827 });
    lastSeenAlerts = S.clock;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); installPrompt = e; render();
    });
    window.addEventListener('appinstalled', function () {
      installedPWA = true; installPrompt = null; say('ติดตั้งแอปลงเครื่องแล้ว', 'ok');
    });
    document.addEventListener('pointerdown', function () { pointerDown = true; });
    document.addEventListener('pointerup', function () { pointerDown = false; });
    document.addEventListener('pointercancel', function () { pointerDown = false; });
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.getElementById('sheetbg').addEventListener('click', function () { sheetOpen = false; render(); });
    window.addEventListener('resize', function () { render(); });
    window.addEventListener('beforeunload', save);
    // เดินระบบล่วงหน้าเมื่อเปิดครั้งแรก
    if (S.raw.length < 60) Core.step(S, 26 * 3600);  // เดินล่วงหน้า 26 ชม.จำลอง ให้โมเดลเห็นวัฏจักรครบวันและมีกราฟให้ดูทันที
    render();
    requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>/* ลงทะเบียน service worker — ล้อมด้วย try/catch เพราะเปิดจากไฟล์ในเครื่อง (file://) จะทำไม่ได้ */
(function () {
  try {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
